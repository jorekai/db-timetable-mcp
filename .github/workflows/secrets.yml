name: Secret Scan

on:
  push:
    branches: [master]
  # Kein paths-ignore: ein Zugangsschlüssel landet genauso in einer Markdown-
  # Datei wie im Code.
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
  GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRs werden ab ihrer Basis geprüft, sonst die ganze Historie.
          fetch-depth: 0
          persist-credentials: false

      # Binär statt Action: keine Lizenzfrage, und die Prüfsumme steht hier fest.
      - name: gitleaks installieren
        run: |
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sum="$GITLEAKS_SHA256_ARM64" ;;
            x86_64|amd64)  arch=x64;   sum="$GITLEAKS_SHA256_X64" ;;
            *) echo "Unbekannte Architektur: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          archiv="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$archiv"
          echo "${sum}  ${archiv}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archiv" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Commits des Pull Requests prüfen
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gitleaks git --config .gitleaks.toml --redact --log-opts="$BASE_SHA..HEAD" -v

      - name: Ganze Historie prüfen
        if: github.event_name != 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact -v
