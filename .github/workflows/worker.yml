# Deploys the Cloudflare Worker that hosts the MCP server in worker/.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  account id from the Cloudflare dashboard
#
# Required worker secrets (set once, manually — never in this repository):
#   npx wrangler secret put DB_TIMETABLE_CLIENT_ID
#   npx wrangler secret put DB_TIMETABLE_CLIENT_SECRET
name: Deploy worker

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: package-lock.json is tracked, but the worker imports the
      # shared client and tool definitions from ../src, so the root
      # dependencies have to be installed too.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npx tsc -p worker/tsconfig.json --noEmit

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
