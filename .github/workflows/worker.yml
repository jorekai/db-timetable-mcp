# Deploys the Cloudflare Worker that hosts the MCP server in worker/.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  account id from the Cloudflare dashboard
#
# Required worker secrets (set once, manually — never in this repository):
#   npx wrangler secret put DB_TIMETABLE_CLIENT_ID
#   npx wrangler secret put DB_TIMETABLE_CLIENT_SECRET
name: Deploy worker

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Root dependencies are required as well: the worker imports the shared
      # client and tool definitions from ../src.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npx tsc -p worker/tsconfig.json --noEmit

      # The Cloudflare secrets are optional: without them the deploy is skipped
      # so the workflow stays green, and it starts deploying as soon as both
      # secrets are configured.
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Worker deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets. Add both to enable the deploy."
          fi

      - name: Deploy
        if: steps.cloudflare.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
