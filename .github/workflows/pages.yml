name: Pages Redirect

# Ersetzt die frühere Browser-Demo durch eine Weiterleitung auf den Worker.
# Nur von Hand: erst starten, wenn der Worker 3.0.0 die Demo ausliefert.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Weiterleitung veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Checkout
      pages: write # Veröffentlichung auf GitHub Pages
      id-token: write # OIDC-Nachweis für deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
