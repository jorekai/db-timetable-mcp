# Deploys the static demo in demo/ to GitHub Pages.
#
# Pages is configured with "GitHub Actions" as the source (not a branch and not
# the /docs folder — docs/ holds the project's own markdown).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The demo is plain HTML/CSS/JS: no build step, no framework, no bundler.
      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
