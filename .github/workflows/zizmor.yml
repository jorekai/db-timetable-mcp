name: GitHub Actions Security Analysis

on:
  push:
    branches: [master]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Checkout und Analyse der Workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security: false, damit kein Schreibrecht auf security-events
      # nötig ist; Befunde lassen stattdessen den Job scheitern.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
          min-confidence: medium
